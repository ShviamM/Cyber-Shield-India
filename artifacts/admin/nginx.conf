# The admin SPA calls the API at same-origin "/api/...". This reverse-proxy
# forwards /api to the api-server container and serves the SPA for everything
# else (client-side routing fallback). Adjust "api-server:8080" to your API host.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
