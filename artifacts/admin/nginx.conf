# The admin SPA is served as static files with client-side routing fallback.
# It calls the API at same-origin "/api/...". On DigitalOcean App Platform the
# app-level ingress routes "/api" to the api component, so nginx only needs to
# serve the SPA here (no reverse proxy — proxying to a component hostname would
# fail to resolve at container start).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
