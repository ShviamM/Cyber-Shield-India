# The public marketing site is served as static files with client-side routing
# fallback. On DigitalOcean App Platform the app-level ingress routes "/api" to
# the api component and "/admin" to the admin component, so this nginx only
# serves the marketing SPA at the domain root.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the site from the apex domain only. www and the default
    # *.ondigitalocean.app hostname otherwise expose duplicate copies of every
    # page to search engines.
    if ($host ~* ^(www\.netraksh\.com|.+\.ondigitalocean\.app)$) {
        return 301 https://netraksh.com$request_uri;
    }

    include /etc/nginx/snippets/security-headers.conf;

    # Routes known to the SPA router (src/App.tsx) get index.html with 200.
    # Keep this list in sync when adding pages.
    location ~ ^/(check|features|family-protection|cyber-safety-center|cyber-laws|about|founder|contact|faq|download|pricing|login|account|disclaimer|privacy-policy|terms-of-service|cookie-policy|responsible-disclosure|data-retention-policy|acceptable-use|security|compliance)?/?$ {
        try_files /index.html =404;
    }
    location ~ ^/cyber-safety-center/[a-z0-9-]+/?$ {
        try_files /index.html =404;
    }

    # Static files; anything else is a real 404 (the SPA still renders its
    # NotFound page, but crawlers see the correct status instead of a soft 404).
    location / {
        try_files $uri =404;
    }
    error_page 404 /index.html;
}
