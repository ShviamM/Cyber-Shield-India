kind = "web"
previewPath = "/brand/"
title = "Netraksh Brand"
version = "1.0.0"
id = "artifacts/brand"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/brand/" ]
localPort = 22358

[services.development]
run = "pnpm --filter @workspace/brand run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/brand", "run", "build" ]
publicDir = "artifacts/brand/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22358"
BASE_PATH = "/brand/"
