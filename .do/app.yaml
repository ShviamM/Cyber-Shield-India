# ============================================================================
# DigitalOcean App Platform spec for Netraksh
# ============================================================================
# This declares the whole app: the API service, the admin dashboard, and the
# custom domain. Both components build from the existing Dockerfiles (build
# context = repo root). The mobile app (kavach-ai) is NOT here — it ships to the
# app stores via EAS and just points at https://netraksh.com/api.
#
# HOW TO USE
# 1. Push this repo to GitHub and make it PUBLIC (App Platform clones it over the
#    generic git source below — no GitHub OAuth needed, but the repo must be
#    publicly readable). Update repo_clone_url/branch below if yours differ.
# 2. Create the app from this spec:
#      doctl apps create --spec .do/app.yaml
#    …or in the DO dashboard: Apps → Create → "Import from App Spec".
#    NOTE: the generic git source does not auto-deploy on push; trigger
#    redeploys with `doctl apps create-deployment <app-id>`.
# 4. Set the SECRET values (DATABASE_URL, MSG91_*, RAZORPAY_*, ADMIN_PASSWORD)
#    in the DO dashboard (App → Settings → each component → Environment
#    Variables). They are marked type: SECRET so DO encrypts them.
# 5. Create a DigitalOcean Managed PostgreSQL database (separately) and paste
#    its connection string into DATABASE_URL.
# 6. Point netraksh.com at the app (see DEPLOYMENT.md → DigitalOcean section).
#
# Routing under the single domain (https://netraksh.com):
#   /api/*  -> api service   (path prefix preserved, so the server still sees /api)
#   /*      -> admin static SPA
# ============================================================================

name: netraksh
# Bangalore region keeps latency low for Indian users. Other options: nyc, sfo, ams, sgp, fra.
region: blr

services:
  # --- Backend API (Express, Node 24, bundled by esbuild) -------------------
  - name: api
    dockerfile_path: artifacts/api-server/Dockerfile
    source_dir: /
    git:
      repo_clone_url: https://github.com/ShviamM/Cyber-Shield-India.git
      branch: main
    http_port: 8080
    # Horizontally scaled. The rate limiter is Redis-backed (see REDIS_URL
    # below), so multiple instances share one set of per-IP counters. IMPORTANT:
    # if you raise instance_count above 1, REDIS_URL MUST be a real Valkey/Redis
    # URL — otherwise each instance limits independently and per-IP protection
    # (incl. OTP/SMS abuse) weakens by a factor of N.
    instance_count: 2
    # Bumped from basic-xxs (0.5 GiB) for headroom. Options: basic-xs (1 GiB),
    # basic-s (2 GiB), professional-xs (1 GiB dedicated CPU), etc.
    instance_size_slug: basic-s
    routes:
      - path: /api
        # The API defines its routes under /api (e.g. /api/healthz), so keep
        # the prefix instead of letting App Platform strip it.
        preserve_path_prefix: true
    health_check:
      http_path: /api/healthz
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      # PostgreSQL — paste your DigitalOcean Managed Postgres connection string.
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_DO_MANAGED_POSTGRES_CONNECTION_STRING
      # DO Managed Postgres uses a private CA. This enables TLS without needing
      # to ship the CA cert. To verify the cert instead, remove this and set
      # DATABASE_CA_CERT to the CA PEM from the DO database dashboard.
      - key: DATABASE_SSL_NO_VERIFY
        scope: RUN_TIME
        value: "true"
      # Max Postgres connections per instance. Total = instance_count × this;
      # keep under your Managed Postgres connection limit.
      - key: DB_POOL_MAX
        scope: RUN_TIME
        value: "10"
      # Redis/Valkey — REQUIRED because instance_count > 1. Shares the rate-limit
      # counters across instances. Provision a DigitalOcean Managed Valkey (see
      # the commented `databases` block at the bottom) and paste its connection
      # string here (rediss://...). If left as REPLACE_ME the app still runs but
      # falls back to per-instance in-memory limiting (weaker per-IP protection).
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_DO_MANAGED_VALKEY_CONNECTION_STRING
      # DO Managed Valkey uses a private CA; this skips cert verification (the
      # connection is still TLS-encrypted via the rediss:// URL).
      - key: REDIS_TLS_NO_VERIFY
        scope: RUN_TIME
        value: "true"
      # Lock browser CORS to the production domain(s). The admin is same-origin
      # so this is belt-and-suspenders; mobile/native clients send no Origin.
      - key: ADMIN_ORIGINS
        scope: RUN_TIME
        value: https://netraksh.com,https://www.netraksh.com
      # --- OTP login (MSG91 OTP Widget) -----------------------------------
      - key: MSG91_AUTH_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: MSG91_WIDGET_ID
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      # --- Payments (Razorpay) --------------------------------------------
      - key: RAZORPAY_KEY_ID
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: RAZORPAY_KEY_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: RAZORPAY_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      # --- Admin console login --------------------------------------------
      # Admin login needs BOTH a password AND at least one admin phone (the
      # first ADMIN_PHONES entry becomes the canonical admin account). If
      # ADMIN_PHONES is empty, /api/auth/admin-login returns 503.
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: ADMIN_PHONES
        scope: RUN_TIME
        # Comma-separated Indian-format numbers; the first is the admin account.
        value: REPLACE_WITH_ADMIN_PHONE
      # --- Optional ---------------------------------------------------------
      # Extra phone numbers allowed into the Super Admin dashboard (defaults to
      # ADMIN_PHONES when unset).
      # - key: SUPER_ADMIN_PHONES
      #   scope: RUN_TIME
      #   value: ""
      # AI scam classifier. Off Replit, set your own OpenAI key (or leave unset
      # to fall back to non-AI fraud signals).
      # - key: OPENAI_API_KEY
      #   scope: RUN_TIME
      #   type: SECRET
      #   value: REPLACE_ME
      # - key: GOOGLE_SAFE_BROWSING_API_KEY
      #   scope: RUN_TIME
      #   type: SECRET
      #   value: REPLACE_ME

  # --- Admin dashboard (static React SPA served by nginx) -------------------
  - name: admin
    dockerfile_path: artifacts/admin/Dockerfile
    source_dir: /
    git:
      repo_clone_url: https://github.com/ShviamM/Cyber-Shield-India.git
      branch: main
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /

# Custom domain. App Platform provisions and auto-renews TLS once DNS resolves.
# See DEPLOYMENT.md (DigitalOcean section) for the GoDaddy DNS steps.
domains:
  - domain: netraksh.com
    type: PRIMARY
    zone: netraksh.com
  - domain: www.netraksh.com
    type: ALIAS
    zone: netraksh.com

# Managed Valkey (Redis) for the shared rate limiter. Either create a DO Managed
# Valkey cluster in the dashboard and paste its rediss:// URL into REDIS_URL
# above, or uncomment this to let App Platform provision a dev database and wire
# ${redis.DATABASE_URL} into REDIS_URL. Required when instance_count > 1.
# databases:
#   - name: redis
#     engine: VALKEY
#     production: false
#     version: "8"

