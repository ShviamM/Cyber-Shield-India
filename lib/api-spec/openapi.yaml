openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Netraksh API — phone-OTP auth, fraud-number reporting, and trust scoring
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Phone-OTP authentication
  - name: reports
    description: Fraud-number reporting
  - name: numbers
    description: Number trust / risk scoring
  - name: categories
    description: Scam categories
  - name: fraud
    description: Multi-signal fraud risk scoring
  - name: admin
    description: Moderation (admin only)
  - name: subscription
    description: Subscription plans, checkout orders, and billing
  - name: notifications
    description: Push notification device registration
  - name: family
    description: Family plan protected members
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/check-phone:
    post:
      operationId: checkPhone
      tags: [auth]
      summary: Check whether a phone number already has an account
      description: Returns whether the given Indian mobile number is a new user, so the client can collect registration details before starting OTP verification via the MSG91 widget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckPhoneRequest"
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckPhoneResult"
        default:
          $ref: "#/components/responses/Error"

  /auth/verify-token:
    post:
      operationId: verifyToken
      tags: [auth]
      summary: Verify an MSG91 widget access token and authenticate
      description: Validates the MSG91 OTP widget access token server-side, then signs the user in. For a new phone number, fullName is required and an account is created. Returns a session token and the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyTokenRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"

  /auth/admin-login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Sign in to the admin console with the shared admin password
      description: Authenticates the admin web console using a single shared admin password. On success, returns a session token bound to the configured admin account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"

  /auth/dev-login:
    post:
      operationId: devLogin
      tags: [auth]
      summary: Development-only test login (no OTP)
      description: >-
        Signs a user in without OTP for local testing in Expo Go, where the
        MSG91 native widget cannot run. Enabled only when the server is not in
        production (NODE_ENV !== "production"); returns 404 in production. For a
        new phone number, fullName is required and an account is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"

  /auth/demo-login:
    post:
      operationId: demoLogin
      tags: [auth]
      summary: Demo login for app store review (no real OTP)
      description: >-
        Signs in a single fixed demo account used by app store reviewers who
        cannot receive an OTP on the demo number. Accepts only the configured
        demo phone number together with the configured demo passcode; every
        other number is rejected. The demo account is a normal (non-admin)
        user. Works in production, unlike dev-login. Disabled (404) when the
        server has no demo credentials configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoLoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Invalidate the current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        default:
          $ref: "#/components/responses/Error"

  /me:
    delete:
      operationId: deleteMyAccount
      tags: [auth]
      summary: Permanently delete the current user's account and all associated data
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        default:
          $ref: "#/components/responses/Error"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List scam categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
        default:
          $ref: "#/components/responses/Error"

  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a fraud report
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "200":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listReports
      tags: [reports]
      summary: Search fraud reports
      parameters:
        - name: phone
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"
        default:
          $ref: "#/components/responses/Error"

  /reports/public/challenge:
    get:
      operationId: getPublicReportChallenge
      tags: [reports]
      summary: Issue a proof-of-work challenge for an anonymous report
      description: >-
        Returns a short-lived, server-signed proof-of-work challenge. The public
        website must solve it (find a value whose sha256 hash has the required
        leading zeros) and submit the solution with POST /reports/public. This
        is a lightweight, login-free bot check that hardens the anonymous report
        endpoint against automated spam without slowing an honest visitor down.
      responses:
        "200":
          description: A fresh challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotCheckChallenge"
        default:
          $ref: "#/components/responses/Error"

  /reports/public:
    post:
      operationId: createPublicReport
      tags: [reports]
      summary: Submit an anonymous fraud report from the public website
      description: >-
        Lets unauthenticated website visitors report a scam phone number,
        website link, or UPI ID into the community reputation database. Abuse is
        limited per client IP rather than per account. Phone reports feed the
        phone reputation store; url/upi reports feed a parallel target
        reputation store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublicReportRequest"
      responses:
        "200":
          description: Report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicReportResult"
        default:
          $ref: "#/components/responses/Error"

  /stats/trending:
    get:
      operationId: getTrendingScams
      tags: [stats]
      summary: Trending scam categories
      description: >-
        Scam categories ranked by recent activity, fusing seeded official
        baselines with live community reports. When `city` is supplied the list
        is scoped to that city.
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Trending scams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingScamListResponse"
        default:
          $ref: "#/components/responses/Error"

  /stats/hotspots:
    get:
      operationId: getCityHotspots
      tags: [stats]
      summary: City scam hotspots
      description: >-
        Cities ranked by total recent scam activity (baseline + live reports),
        with week-over-week change. When `city` is supplied it is always
        included in the result even if outside the top ranks.
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: City hotspots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityHotspotListResponse"
        default:
          $ref: "#/components/responses/Error"

  /stats/scam-of-day:
    get:
      operationId: getScamOfDay
      tags: [stats]
      summary: Most active scam right now
      description: The single top-trending scam category with bilingual title, tip, and the cities seeing it most.
      responses:
        "200":
          description: Scam of the day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScamOfDay"
        default:
          $ref: "#/components/responses/Error"

  /me/location:
    patch:
      operationId: updateMyLocation
      tags: [auth]
      summary: Update the current user's detected city/location
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"

  /numbers/{phone}/check:
    get:
      operationId: checkNumber
      tags: [numbers]
      summary: Check the risk level of a phone number
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Risk assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberCheckResponse"
        default:
          $ref: "#/components/responses/Error"

  /check:
    post:
      operationId: fraudCheck
      tags: [fraud]
      summary: Multi-signal fraud risk check
      description: >-
        Evaluates a target (phone, URL, UPI ID, or raw message text) by fusing
        several signals — AI message classification, URL heuristics and an
        optional external threat feed, and community phone reputation — into one
        explainable risk verdict (level, 0-100 score, and contributing reasons).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FraudCheckRequest"
      responses:
        "200":
          description: Risk verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudVerdict"
        default:
          $ref: "#/components/responses/Error"

  /screening/blocklist:
    get:
      operationId: getScreeningBlocklist
      tags: [screening]
      summary: Known high-risk numbers for on-device call/SMS screening
      description: >-
        Returns the community-sourced list of high-risk phone numbers (verified
        scams and frequently-reported numbers) so the app can warn about scam
        calls locally on-device. Available to all signed-in users (basic
        known-scam screening is a free feature).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Known high-risk numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningBlocklist"
        default:
          $ref: "#/components/responses/Error"

  /me/usage:
    get:
      operationId: getUsage
      tags: [usage]
      summary: Current user's daily check usage and premium status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usage status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageStatus"
        default:
          $ref: "#/components/responses/Error"

  /admin/stats:
    get:
      operationId: adminStats
      tags: [admin]
      summary: Dashboard metrics overview
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        default:
          $ref: "#/components/responses/Error"

  /admin/reports:
    get:
      operationId: adminListReports
      tags: [admin]
      summary: List reports for moderation
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: phone
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportListResponse"
        default:
          $ref: "#/components/responses/Error"

  /admin/reports/{id}:
    patch:
      operationId: adminUpdateReport
      tags: [admin]
      summary: Update a report's moderation status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportStatusRequest"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReport"
        default:
          $ref: "#/components/responses/Error"

  /admin/numbers/{phone}/verify:
    post:
      operationId: adminVerifyNumber
      tags: [admin]
      summary: Mark a number as verified scam (or clear it)
      security:
        - bearerAuth: []
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyNumberRequest"
      responses:
        "200":
          description: Updated reputation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberReputation"
        default:
          $ref: "#/components/responses/Error"

  /admin/target-reports:
    get:
      operationId: adminListTargetReports
      tags: [admin]
      summary: List url/upi community reports for moderation
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Filter by target kind ("url" or "upi").
          schema:
            type: string
            enum: [url, upi]
        - name: search
          in: query
          required: false
          description: Case-insensitive substring match on the target value.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Target reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTargetReportListResponse"
        default:
          $ref: "#/components/responses/Error"

  /admin/target-reports/{id}:
    patch:
      operationId: adminUpdateTargetReport
      tags: [admin]
      summary: Update a url/upi report's moderation status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportStatusRequest"
      responses:
        "200":
          description: Updated target report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTargetReport"
        default:
          $ref: "#/components/responses/Error"

  /admin/targets/verify:
    post:
      operationId: adminVerifyTarget
      tags: [admin]
      summary: Mark a url/upi target as verified scam (or clear it)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyTargetRequest"
      responses:
        "200":
          description: Updated target reputation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetReputation"
        default:
          $ref: "#/components/responses/Error"

  /admin/super/overview:
    get:
      operationId: superAdminOverview
      tags: [admin]
      summary: Platform owner operations overview
      description: >-
        Owner-only dashboard data: revenue, AI usage and estimated cost,
        infrastructure health, database health, storage consumption, and cloud
        cost. Restricted to platform owners (super admins).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Super admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperAdminOverview"
        default:
          $ref: "#/components/responses/Error"

  /admin/business-metrics:
    get:
      operationId: adminBusinessMetrics
      tags: [admin]
      summary: Revenue and subscription business metrics
      description: >-
        Revenue, monthly recurring revenue (MRR), active subscription counts,
        upcoming renewals, and families protected — derived from verified
        payments and active subscriptions.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Business metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessMetrics"
        default:
          $ref: "#/components/responses/Error"

  /admin/trials:
    get:
      operationId: adminListTrials
      tags: [admin]
      summary: List members currently on a free trial
      description: >-
        Members whose subscription is in the "trialing" state and has not yet
        expired, with the user's name, phone, plan, when the trial started and
        when it ends. Trials are started without a card from either the website
        or the mobile app and reconciled into the same subscriptions table.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active trials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialListResponse"
        default:
          $ref: "#/components/responses/Error"

  /admin/roles:
    get:
      operationId: adminListRoles
      tags: [admin]
      summary: List assignable roles
      description: >-
        The data-driven roles catalogue used to populate the role selector. New
        roles can be added as rows without code changes.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesListResponse"
        default:
          $ref: "#/components/responses/Error"

  /admin/users:
    get:
      operationId: adminUsers
      tags: [admin]
      summary: List registered users with search, filters and pagination
      description: >-
        Every registered user with role, account status, plan/subscription
        status, device count and number of scam reports filed. Supports search
        by name or phone, filtering by role and status, and pagination.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Registered users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersListResponse"
        default:
          $ref: "#/components/responses/Error"

  /admin/users/{id}:
    get:
      operationId: adminGetUser
      tags: [admin]
      summary: Get a single user's detail
      description: >-
        Full profile for one user: registration date, device count, last login,
        trial/subscription status, role and number of scam reports filed.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        default:
          $ref: "#/components/responses/Error"

  /admin/users/{id}/trial/extend:
    post:
      operationId: adminExtendTrial
      tags: [admin]
      summary: Extend a user's trial
      description: >-
        Add days to a user's trial (lengthening an active trial or reactivating
        an expired one). Sends a push notification and records an audit entry.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendTrialRequest"
      responses:
        "200":
          description: Updated trial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTrialActionResponse"
        default:
          $ref: "#/components/responses/Error"

  /admin/users/{id}/trial/activate:
    post:
      operationId: adminActivateTrial
      tags: [admin]
      summary: Activate (reactivate / start) a user's trial
      description: >-
        Start a fresh trial window from now for an expired or never-started
        trial. Sends a push notification and records an audit entry.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateTrialRequest"
      responses:
        "200":
          description: Updated trial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTrialActionResponse"
        default:
          $ref: "#/components/responses/Error"

  /admin/users/{id}/trial/reset:
    post:
      operationId: adminResetTrial
      tags: [admin]
      summary: Reset a user's trial eligibility
      description: >-
        Clear the trial so the user can start a fresh free trial from the app.
        Records an audit entry.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetTrialRequest"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTrialActionResponse"
        default:
          $ref: "#/components/responses/Error"

  /admin/users/{id}/role:
    patch:
      operationId: adminUpdateUserRole
      tags: [admin]
      summary: Change a user's role
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserRoleResult"
        default:
          $ref: "#/components/responses/Error"

  /admin/users/{id}/status:
    patch:
      operationId: adminUpdateUserStatus
      tags: [admin]
      summary: Change a user's account status (active / suspended / blocked)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserStatusResult"
        default:
          $ref: "#/components/responses/Error"

  /admin/users/{id}/audit:
    get:
      operationId: adminGetUserAudit
      tags: [admin]
      summary: Audit history for a user
      description: Privileged admin actions taken against this user, newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogListResponse"
        default:
          $ref: "#/components/responses/Error"

  /admin/audit:
    get:
      operationId: adminListAudit
      tags: [admin]
      summary: Global admin audit log
      description: Recent privileged admin actions across all users, newest first.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogListResponse"
        default:
          $ref: "#/components/responses/Error"

  /admin/fraud-map:
    get:
      operationId: adminFraudMap
      tags: [admin]
      summary: Fraud report volume aggregated by Indian state
      description: >-
        Scam/fraud report volume grouped by Indian state from live community
        reports only, ranked highest first.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Fraud volume by state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudMapResponse"
        default:
          $ref: "#/components/responses/Error"

  /subscription/plans:
    get:
      operationId: getSubscriptionPlans
      tags: [subscription]
      summary: List subscription plans
      description: Returns the server-authoritative plan catalogue (pricing in paise).
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanList"
        default:
          $ref: "#/components/responses/Error"

  /subscription:
    get:
      operationId: getMySubscription
      tags: [subscription]
      summary: Get the current user's subscription status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        default:
          $ref: "#/components/responses/Error"

  /subscription/order:
    post:
      operationId: createSubscriptionOrder
      tags: [subscription]
      summary: Create a Razorpay order to upgrade to a paid plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionOrder"
        default:
          $ref: "#/components/responses/Error"

  /subscription/verify:
    post:
      operationId: verifySubscriptionPayment
      tags: [subscription]
      summary: Verify a checkout payment and activate the subscription
      description: Verifies the Razorpay signature server-side. Client payment status is never trusted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentRequest"
      responses:
        "200":
          description: Subscription status after activation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        default:
          $ref: "#/components/responses/Error"

  /subscription/trial:
    post:
      operationId: startSubscriptionTrial
      tags: [subscription]
      summary: Start a 7-day free trial (no card required)
      description: >
        Grants 7 days of the chosen paid plan with no payment. After the trial
        ends the plan lapses to free and the user must pay to continue. Each user
        is eligible for one trial only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartTrialRequest"
      responses:
        "200":
          description: Subscription status after starting the trial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        default:
          $ref: "#/components/responses/Error"

  /subscription/cancel:
    post:
      operationId: cancelSubscription
      tags: [subscription]
      summary: Cancel auto-renewal (lapses to free at period end)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription status after cancellation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        default:
          $ref: "#/components/responses/Error"

  /subscription/payments:
    get:
      operationId: listMyPayments
      tags: [subscription]
      summary: List the current user's payment history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        default:
          $ref: "#/components/responses/Error"

  /me/push-token:
    post:
      operationId: registerPushToken
      tags: [notifications]
      summary: Register this device's Expo push token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenRequest"
      responses:
        "200":
          description: Token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        default:
          $ref: "#/components/responses/Error"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List safety broadcasts sent to the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent broadcasts, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        default:
          $ref: "#/components/responses/Error"

  /family/members:
    get:
      operationId: listFamilyMembers
      tags: [family]
      summary: List the current user's protected family members
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Family members with the plan's member cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMemberList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addFamilyMember
      tags: [family]
      summary: Add a protected family member (requires the Family plan)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFamilyMemberRequest"
      responses:
        "200":
          description: The created family member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMember"
        default:
          $ref: "#/components/responses/Error"

  /family/members/{id}:
    delete:
      operationId: removeFamilyMember
      tags: [family]
      summary: Remove a protected family member
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        default:
          $ref: "#/components/responses/Error"

  /admin/broadcasts:
    get:
      operationId: adminListBroadcasts
      tags: [admin]
      summary: List past push broadcasts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Broadcast history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: adminSendBroadcast
      tags: [admin]
      summary: Send a push broadcast to all registered devices
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBroadcastRequest"
      responses:
        "200":
          description: The broadcast that was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Broadcast"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    CheckPhoneRequest:
      type: object
      properties:
        phone:
          type: string
          description: Indian mobile number in any common format
      required:
        - phone

    CheckPhoneResult:
      type: object
      properties:
        isNewUser:
          type: boolean
          description: True when no account exists yet for this number
      required:
        - isNewUser

    VerifyTokenRequest:
      type: object
      properties:
        accessToken:
          type: string
          description: The MSG91 widget access token returned after OTP verification
        fullName:
          type: string
          nullable: true
          description: Required when registering a new number
        location:
          type: string
          nullable: true
      required:
        - accessToken

    AdminLoginRequest:
      type: object
      properties:
        password:
          type: string
          description: The shared admin console password
      required:
        - password

    DevLoginRequest:
      type: object
      properties:
        phone:
          type: string
          description: Indian mobile number in any common format
        fullName:
          type: string
          nullable: true
          description: Required when registering a new number
        location:
          type: string
          nullable: true
      required:
        - phone

    DemoLoginRequest:
      type: object
      properties:
        phone:
          type: string
          description: Must equal the configured demo phone number
        otp:
          type: string
          description: The fixed demo passcode for the app-store-review account
      required:
        - phone
        - otp

    User:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        phone:
          type: string
        location:
          type: string
          nullable: true
        isAdmin:
          type: boolean
        isSuperAdmin:
          type: boolean
          description: >-
            True for platform owners who may access the Super Admin dashboard.
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - phone
        - isAdmin
        - isSuperAdmin
        - status
        - createdAt

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    ScamCategory:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        nameEn:
          type: string
        nameHi:
          type: string
          nullable: true
        descriptionEn:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        sortOrder:
          type: integer
      required:
        - id
        - key
        - nameEn
        - sortOrder

    CategoryListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ScamCategory"
      required:
        - categories

    TrendingScam:
      type: object
      properties:
        categoryKey:
          type: string
        type:
          type: string
          description: English category name
        typeHi:
          type: string
          nullable: true
          description: Hindi category name
        description:
          type: string
          nullable: true
        tip:
          type: string
          nullable: true
        tipHi:
          type: string
          nullable: true
        count:
          type: integer
          description: Combined baseline + live report volume
        trend:
          type: string
          enum: [critical, high, medium]
        city:
          type: string
          nullable: true
          description: Top city for this scam in the queried scope
        lastReportedAt:
          type: string
          format: date-time
          nullable: true
          description: Most recent live report timestamp, null when baseline-only
      required:
        - categoryKey
        - type
        - count
        - trend

    TrendingScamListResponse:
      type: object
      properties:
        scams:
          type: array
          items:
            $ref: "#/components/schemas/TrendingScam"
        total:
          type: integer
          description: Sum of all trending counts in scope
      required:
        - scams
        - total

    CityHotspot:
      type: object
      properties:
        city:
          type: string
        cases:
          type: integer
        changePct:
          type: number
          description: Signed week-over-week change percentage
        up:
          type: boolean
          description: True when activity increased versus the previous period
      required:
        - city
        - cases
        - changePct
        - up

    CityHotspotListResponse:
      type: object
      properties:
        hotspots:
          type: array
          items:
            $ref: "#/components/schemas/CityHotspot"
      required:
        - hotspots

    ScamOfDay:
      type: object
      properties:
        categoryKey:
          type: string
        tag:
          type: string
        title:
          type: string
        titleHi:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        tip:
          type: string
          nullable: true
        tipHi:
          type: string
          nullable: true
        reports:
          type: integer
        cities:
          type: array
          items:
            type: string
      required:
        - categoryKey
        - tag
        - title
        - reports
        - cities

    UpdateLocationRequest:
      type: object
      properties:
        location:
          type: string
          description: Detected city or location label
      required:
        - location

    CreateReportRequest:
      type: object
      properties:
        phone:
          type: string
        categoryKey:
          type: string
        description:
          type: string
        city:
          type: string
          nullable: true
          description: City where the incident was reported, used for hotspot stats
        incidentDate:
          type: string
          format: date-time
          nullable: true
      required:
        - phone
        - categoryKey
        - description

    CreatePublicReportRequest:
      type: object
      properties:
        type:
          type: string
          enum: [phone, url, upi]
          default: phone
          description: >-
            The kind of target being reported. Defaults to "phone" for
            backward compatibility when omitted.
        value:
          type: string
          description: >-
            The target being reported as a scam — a phone number, website link,
            or UPI ID. For phone reports the legacy `phone` field is also
            accepted.
        phone:
          type: string
          nullable: true
          description: >-
            Deprecated alias for `value` when type is "phone". Kept for
            backward compatibility.
        categoryKey:
          type: string
          nullable: true
          description: Optional scam category key. Defaults to "other" when omitted.
        powChallenge:
          type: string
          nullable: true
          description: The `challenge` from GET /reports/public/challenge.
        powExpiresAt:
          type: integer
          nullable: true
          description: The challenge `expiresAt`, echoed back unchanged.
        powDifficulty:
          type: integer
          nullable: true
          description: The challenge `difficulty`, echoed back unchanged.
        powSignature:
          type: string
          nullable: true
          description: The challenge `signature`, echoed back unchanged.
        powSolution:
          type: string
          nullable: true
          description: >-
            A value such that sha256(`challenge.solution`) has `difficulty`
            leading hex zeros.
      required: []

    BotCheckChallenge:
      type: object
      properties:
        challenge:
          type: string
          description: Random nonce the client must find a solution for.
        expiresAt:
          type: integer
          description: Unix epoch milliseconds after which the challenge is invalid.
        difficulty:
          type: integer
          description: >-
            Number of leading hex zeros required in sha256(`challenge.solution`).
        signature:
          type: string
          description: Server HMAC binding the challenge so it can't be forged.
      required:
        - challenge
        - expiresAt
        - difficulty
        - signature

    PublicReportResult:
      type: object
      properties:
        type:
          type: string
          enum: [phone, url, upi]
          description: The kind of target the report was filed against.
        value:
          type: string
          description: Normalized target the report was filed against.
        reportCount:
          type: integer
          description: Total community reports now on record for this target.
      required:
        - type
        - value
        - reportCount

    Report:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        categoryKey:
          type: string
        description:
          type: string
        incidentDate:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        reporterName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - phone
        - categoryKey
        - description
        - status
        - createdAt

    ReportListResponse:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        total:
          type: integer
      required:
        - reports
        - total

    AdminReport:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        categoryKey:
          type: string
        description:
          type: string
        incidentDate:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        reporterId:
          type: string
          nullable: true
        reporterName:
          type: string
          nullable: true
        reporterPhone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        verifiedScam:
          type: boolean
      required:
        - id
        - phone
        - categoryKey
        - description
        - status
        - reporterId
        - createdAt
        - updatedAt
        - verifiedScam

    AdminReportListResponse:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/AdminReport"
        total:
          type: integer
      required:
        - reports
        - total

    AdminTargetReport:
      type: object
      description: A community report against a url/upi target, with moderation metadata.
      properties:
        id:
          type: string
        targetType:
          type: string
          enum: [url, upi]
        targetValue:
          type: string
        categoryKey:
          type: string
        description:
          type: string
        status:
          type: string
        reporterId:
          type: string
          nullable: true
        reporterName:
          type: string
          nullable: true
        reporterPhone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        verifiedScam:
          type: boolean
        reportCount:
          type: integer
      required:
        - id
        - targetType
        - targetValue
        - categoryKey
        - description
        - status
        - reporterId
        - createdAt
        - updatedAt
        - verifiedScam
        - reportCount

    AdminTargetReportListResponse:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/AdminTargetReport"
        total:
          type: integer
      required:
        - reports
        - total

    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        premiumUsers:
          type: integer
        fraudReports:
          type: integer
        blockedNumbers:
          type: integer
        revenuePaise:
          type: integer
        dailyActiveUsers:
          type: integer
      required:
        - totalUsers
        - premiumUsers
        - fraudReports
        - blockedNumbers
        - revenuePaise
        - dailyActiveUsers

    BusinessMetrics:
      type: object
      properties:
        revenuePaise:
          type: integer
          description: All-time verified revenue, in paise.
        revenueThisMonthPaise:
          type: integer
          description: Verified revenue in the current calendar month, in paise.
        mrrPaise:
          type: integer
          description: Monthly recurring revenue from active paid subscriptions, in paise.
        activeSubscriptions:
          type: integer
          description: Active premium + family subscriptions.
        premiumSubscriptions:
          type: integer
        familySubscriptions:
          type: integer
        familiesProtected:
          type: integer
          description: Active family-plan subscriptions (one per protected family).
        renewalsDue:
          type: integer
          description: Active paid subscriptions renewing in the next 30 days.
        newSubscriptions:
          type: integer
          description: Paid subscriptions started in the last 30 days.
        activeTrials:
          type: integer
          description: Members currently on a non-expired free trial.
        totalUsers:
          type: integer
          description: All registered users, including those who never started a trial.
      required:
        - revenuePaise
        - revenueThisMonthPaise
        - mrrPaise
        - activeSubscriptions
        - premiumSubscriptions
        - familySubscriptions
        - familiesProtected
        - renewalsDue
        - newSubscriptions
        - activeTrials
        - totalUsers

    Trial:
      type: object
      properties:
        userId:
          type: string
        fullName:
          type: string
          nullable: true
        phone:
          type: string
        plan:
          type: string
        trialStartedAt:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - userId
        - phone
        - plan
        - createdAt

    TrialListResponse:
      type: object
      properties:
        trials:
          type: array
          items:
            $ref: "#/components/schemas/Trial"
        total:
          type: integer
      required:
        - trials
        - total

    RegisteredUser:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        phone:
          type: string
        location:
          type: string
          nullable: true
        isAdmin:
          type: boolean
        status:
          type: string
        plan:
          type: string
          nullable: true
          description: Current subscription plan, or null if the user never subscribed.
        subscriptionStatus:
          type: string
          nullable: true
          description: Current subscription status, or null if the user has no subscription.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - phone
        - isAdmin
        - status
        - createdAt

    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/RegisteredUser"
        total:
          type: integer
      required:
        - users
        - total

    RoleInfo:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: string
        isSystem:
          type: boolean
      required:
        - name
        - label
        - permissions
        - isSystem

    RolesListResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleInfo"
      required:
        - roles

    AdminUserSummary:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        phone:
          type: string
        location:
          type: string
          nullable: true
        role:
          type: string
        isAdmin:
          type: boolean
        status:
          type: string
        plan:
          type: string
          nullable: true
        subscriptionStatus:
          type: string
          nullable: true
