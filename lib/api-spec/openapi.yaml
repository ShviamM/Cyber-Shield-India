openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Netraksh API — phone-OTP auth, fraud-number reporting, and trust scoring
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Phone-OTP authentication
  - name: reports
    description: Fraud-number reporting
  - name: numbers
    description: Number trust / risk scoring
  - name: categories
    description: Scam categories
  - name: fraud
    description: Multi-signal fraud risk scoring
  - name: admin
    description: Moderation (admin only)
  - name: subscription
    description: Subscription plans, checkout orders, and billing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/check-phone:
    post:
      operationId: checkPhone
      tags: [auth]
      summary: Check whether a phone number already has an account
      description: Returns whether the given Indian mobile number is a new user, so the client can collect registration details before starting OTP verification via the MSG91 widget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckPhoneRequest"
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckPhoneResult"
        default:
          $ref: "#/components/responses/Error"

  /auth/verify-token:
    post:
      operationId: verifyToken
      tags: [auth]
      summary: Verify an MSG91 widget access token and authenticate
      description: Validates the MSG91 OTP widget access token server-side, then signs the user in. For a new phone number, fullName is required and an account is created. Returns a session token and the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyTokenRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"

  /auth/admin-login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Sign in to the admin console with the shared admin password
      description: Authenticates the admin web console using a single shared admin password. On success, returns a session token bound to the configured admin account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Invalidate the current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        default:
          $ref: "#/components/responses/Error"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List scam categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
        default:
          $ref: "#/components/responses/Error"

  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a fraud report
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "200":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listReports
      tags: [reports]
      summary: Search fraud reports
      parameters:
        - name: phone
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"
        default:
          $ref: "#/components/responses/Error"

  /stats/trending:
    get:
      operationId: getTrendingScams
      tags: [stats]
      summary: Trending scam categories
      description: >-
        Scam categories ranked by recent activity, fusing seeded official
        baselines with live community reports. When `city` is supplied the list
        is scoped to that city.
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Trending scams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingScamListResponse"
        default:
          $ref: "#/components/responses/Error"

  /stats/hotspots:
    get:
      operationId: getCityHotspots
      tags: [stats]
      summary: City scam hotspots
      description: >-
        Cities ranked by total recent scam activity (baseline + live reports),
        with week-over-week change. When `city` is supplied it is always
        included in the result even if outside the top ranks.
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: City hotspots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityHotspotListResponse"
        default:
          $ref: "#/components/responses/Error"

  /stats/scam-of-day:
    get:
      operationId: getScamOfDay
      tags: [stats]
      summary: Most active scam right now
      description: The single top-trending scam category with bilingual title, tip, and the cities seeing it most.
      responses:
        "200":
          description: Scam of the day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScamOfDay"
        default:
          $ref: "#/components/responses/Error"

  /me/location:
    patch:
      operationId: updateMyLocation
      tags: [auth]
      summary: Update the current user's detected city/location
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"

  /numbers/{phone}/check:
    get:
      operationId: checkNumber
      tags: [numbers]
      summary: Check the risk level of a phone number
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Risk assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberCheckResponse"
        default:
          $ref: "#/components/responses/Error"

  /check:
    post:
      operationId: fraudCheck
      tags: [fraud]
      summary: Multi-signal fraud risk check
      description: >-
        Evaluates a target (phone, URL, UPI ID, or raw message text) by fusing
        several signals — AI message classification, URL heuristics and an
        optional external threat feed, and community phone reputation — into one
        explainable risk verdict (level, 0-100 score, and contributing reasons).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FraudCheckRequest"
      responses:
        "200":
          description: Risk verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudVerdict"
        default:
          $ref: "#/components/responses/Error"

  /admin/stats:
    get:
      operationId: adminStats
      tags: [admin]
      summary: Dashboard metrics overview
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        default:
          $ref: "#/components/responses/Error"

  /admin/reports:
    get:
      operationId: adminListReports
      tags: [admin]
      summary: List reports for moderation
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: phone
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportListResponse"
        default:
          $ref: "#/components/responses/Error"

  /admin/reports/{id}:
    patch:
      operationId: adminUpdateReport
      tags: [admin]
      summary: Update a report's moderation status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportStatusRequest"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReport"
        default:
          $ref: "#/components/responses/Error"

  /admin/numbers/{phone}/verify:
    post:
      operationId: adminVerifyNumber
      tags: [admin]
      summary: Mark a number as verified scam (or clear it)
      security:
        - bearerAuth: []
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyNumberRequest"
      responses:
        "200":
          description: Updated reputation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberReputation"
        default:
          $ref: "#/components/responses/Error"

  /subscription/plans:
    get:
      operationId: getSubscriptionPlans
      tags: [subscription]
      summary: List subscription plans
      description: Returns the server-authoritative plan catalogue (pricing in paise).
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanList"
        default:
          $ref: "#/components/responses/Error"

  /subscription:
    get:
      operationId: getMySubscription
      tags: [subscription]
      summary: Get the current user's subscription status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        default:
          $ref: "#/components/responses/Error"

  /subscription/order:
    post:
      operationId: createSubscriptionOrder
      tags: [subscription]
      summary: Create a Razorpay order to upgrade to a paid plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionOrder"
        default:
          $ref: "#/components/responses/Error"

  /subscription/verify:
    post:
      operationId: verifySubscriptionPayment
      tags: [subscription]
      summary: Verify a checkout payment and activate the subscription
      description: Verifies the Razorpay signature server-side. Client payment status is never trusted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentRequest"
      responses:
        "200":
          description: Subscription status after activation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        default:
          $ref: "#/components/responses/Error"

  /subscription/cancel:
    post:
      operationId: cancelSubscription
      tags: [subscription]
      summary: Cancel auto-renewal (lapses to free at period end)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription status after cancellation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        default:
          $ref: "#/components/responses/Error"

  /subscription/payments:
    get:
      operationId: listMyPayments
      tags: [subscription]
      summary: List the current user's payment history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    CheckPhoneRequest:
      type: object
      properties:
        phone:
          type: string
          description: Indian mobile number in any common format
      required:
        - phone

    CheckPhoneResult:
      type: object
      properties:
        isNewUser:
          type: boolean
          description: True when no account exists yet for this number
      required:
        - isNewUser

    VerifyTokenRequest:
      type: object
      properties:
        accessToken:
          type: string
          description: The MSG91 widget access token returned after OTP verification
        fullName:
          type: string
          nullable: true
          description: Required when registering a new number
        location:
          type: string
          nullable: true
      required:
        - accessToken

    AdminLoginRequest:
      type: object
      properties:
        password:
          type: string
          description: The shared admin console password
      required:
        - password

    User:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        phone:
          type: string
        location:
          type: string
          nullable: true
        isAdmin:
          type: boolean
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - phone
        - isAdmin
        - status
        - createdAt

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    ScamCategory:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        nameEn:
          type: string
        descriptionEn:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        sortOrder:
          type: integer
      required:
        - id
        - key
        - nameEn
        - sortOrder

    CategoryListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ScamCategory"
      required:
        - categories

    TrendingScam:
      type: object
      properties:
        categoryKey:
          type: string
        type:
          type: string
          description: English category name
        typeHi:
          type: string
          nullable: true
          description: Hindi category name
        description:
          type: string
          nullable: true
        tip:
          type: string
          nullable: true
        tipHi:
          type: string
          nullable: true
        count:
          type: integer
          description: Combined baseline + live report volume
        trend:
          type: string
          enum: [critical, high, medium]
        city:
          type: string
          nullable: true
          description: Top city for this scam in the queried scope
        lastReportedAt:
          type: string
          format: date-time
          nullable: true
          description: Most recent live report timestamp, null when baseline-only
      required:
        - categoryKey
        - type
        - count
        - trend

    TrendingScamListResponse:
      type: object
      properties:
        scams:
          type: array
          items:
            $ref: "#/components/schemas/TrendingScam"
        total:
          type: integer
          description: Sum of all trending counts in scope
      required:
        - scams
        - total

    CityHotspot:
      type: object
      properties:
        city:
          type: string
        cases:
          type: integer
        changePct:
          type: number
          description: Signed week-over-week change percentage
        up:
          type: boolean
          description: True when activity increased versus the previous period
      required:
        - city
        - cases
        - changePct
        - up

    CityHotspotListResponse:
      type: object
      properties:
        hotspots:
          type: array
          items:
            $ref: "#/components/schemas/CityHotspot"
      required:
        - hotspots

    ScamOfDay:
      type: object
      properties:
        categoryKey:
          type: string
        tag:
          type: string
        title:
          type: string
        titleHi:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        tip:
          type: string
          nullable: true
        tipHi:
          type: string
          nullable: true
        reports:
          type: integer
        cities:
          type: array
          items:
            type: string
      required:
        - categoryKey
        - tag
        - title
        - reports
        - cities

    UpdateLocationRequest:
      type: object
      properties:
        location:
          type: string
          description: Detected city or location label
      required:
        - location

    CreateReportRequest:
      type: object
      properties:
        phone:
          type: string
        categoryKey:
          type: string
        description:
          type: string
        city:
          type: string
          nullable: true
          description: City where the incident was reported, used for hotspot stats
        incidentDate:
          type: string
          format: date-time
          nullable: true
      required:
        - phone
        - categoryKey
        - description

    Report:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        categoryKey:
          type: string
        description:
          type: string
        incidentDate:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        reporterName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - phone
        - categoryKey
        - description
        - status
        - createdAt

    ReportListResponse:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        total:
          type: integer
      required:
        - reports
        - total

    AdminReport:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        categoryKey:
          type: string
        description:
          type: string
        incidentDate:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        reporterId:
          type: string
        reporterName:
          type: string
          nullable: true
        reporterPhone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        verifiedScam:
          type: boolean
      required:
        - id
        - phone
        - categoryKey
        - description
        - status
        - reporterId
        - createdAt
        - updatedAt
        - verifiedScam

    AdminReportListResponse:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/AdminReport"
        total:
          type: integer
      required:
        - reports
        - total

    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        premiumUsers:
          type: integer
        fraudReports:
          type: integer
        blockedNumbers:
          type: integer
        revenuePaise:
          type: integer
        dailyActiveUsers:
          type: integer
      required:
        - totalUsers
        - premiumUsers
        - fraudReports
        - blockedNumbers
        - revenuePaise
        - dailyActiveUsers

    NumberCheckResponse:
      type: object
      properties:
        phone:
          type: string
        riskLevel:
          type: string
          enum: [low, medium, high, unknown]
        reportCount:
          type: integer
        verifiedScam:
          type: boolean
        lastReportedAt:
          type: string
          format: date-time
          nullable: true
        categories:
          type: array
          items:
            $ref: "#/components/schemas/NumberCategoryCount"
      required:
        - phone
        - riskLevel
        - reportCount
        - verifiedScam
        - categories

    NumberCategoryCount:
      type: object
      properties:
        key:
          type: string
          description: The scam category key
        count:
          type: integer
          description: Number of visible reports filed under this category for the number
      required:
        - key
        - count

    UpdateReportStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [pending, verified, rejected, spam]
      required:
        - status

    VerifyNumberRequest:
      type: object
      properties:
        verifiedScam:
          type: boolean
      required:
        - verifiedScam

    NumberReputation:
      type: object
      properties:
        phone:
          type: string
        reportCount:
          type: integer
        verifiedScam:
          type: boolean
        lastReportedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - phone
        - reportCount
        - verifiedScam

    FraudCheckRequest:
      type: object
      properties:
        type:
          type: string
          enum: [phone, url, upi, message]
          description: The kind of target being checked
        value:
          type: string
          description: The phone number, URL, UPI ID, or raw message text to evaluate
      required:
        - type
        - value

    FraudSignal:
      type: object
      description: A single contributing factor in the overall verdict
      properties:
        source:
          type: string
          enum:
            - message_ai
            - url_heuristic
            - url_threat_feed
            - phone_reputation
            - upi_heuristic
          description: Which analyzer produced this signal
        severity:
          type: string
          enum: [info, low, medium, high]
        label:
          type: string
          description: Human-readable explanation of the signal
      required:
        - source
        - severity
        - label

    FraudVerdict:
      type: object
      properties:
        type:
          type: string
          enum: [phone, url, upi, message]
        value:
          type: string
          description: The normalized/echoed target (never contains secrets)
        riskLevel:
          type: string
          enum: [low, medium, high, unknown]
        score:
          type: integer
          description: Overall risk score from 0 (safe) to 100 (high risk)
        category:
          type: string
          nullable: true
          description: Detected scam category key when a message is classified
        confidence:
          type: number
          nullable: true
          description: AI classification confidence (0-1) when applicable
        reasons:
          type: array
          description: Human-readable contributing reasons
          items:
            type: string
        signals:
          type: array
          description: Structured breakdown of every contributing signal
          items:
            $ref: "#/components/schemas/FraudSignal"
      required:
        - type
        - value
        - riskLevel
        - score
        - reasons
        - signals

    SubscriptionPlan:
      type: object
      properties:
        key:
          type: string
          enum: [free, premium, family]
        amount:
          type: integer
          description: Price per interval in paise (0 for free)
        currency:
          type: string
        interval:
          type: string
          enum: [month]
        premium:
          type: boolean
          description: Whether this plan unlocks premium-gated features
      required:
        - key
        - amount
        - currency
        - interval
        - premium

    SubscriptionPlanList:
      type: object
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionPlan"
      required:
        - plans

    SubscriptionStatus:
      type: object
      properties:
        plan:
          type: string
          enum: [free, premium, family]
        status:
          type: string
          enum: [active, canceled, expired, past_due]
        currentPeriodStart:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        cancelAtPeriodEnd:
          type: boolean
        isPremium:
          type: boolean
          description: Server-computed — true when a paid plan is currently active
      required:
        - plan
        - status
        - cancelAtPeriodEnd
        - isPremium

    CreateOrderRequest:
      type: object
      properties:
        plan:
          type: string
          enum: [premium, family]
      required:
        - plan

    SubscriptionOrder:
      type: object
      properties:
        orderId:
          type: string
        amount:
          type: integer
        currency:
          type: string
        keyId:
          type: string
          description: Razorpay public key id for the checkout SDK
        plan:
          type: string
          enum: [premium, family]
      required:
        - orderId
        - amount
        - currency
        - keyId
        - plan

    VerifyPaymentRequest:
      type: object
      properties:
        orderId:
          type: string
        paymentId:
          type: string
        signature:
          type: string
      required:
        - orderId
        - paymentId
        - signature

    Payment:
      type: object
      properties:
        id:
          type: string
        plan:
          type: string
        amount:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum: [created, paid, failed]
        razorpayPaymentId:
          type: string
          nullable: true
        periodStart:
          type: string
          format: date-time
          nullable: true
        periodEnd:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - plan
        - amount
        - currency
        - status
        - createdAt

    PaymentList:
      type: object
      properties:
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
      required:
        - payments
