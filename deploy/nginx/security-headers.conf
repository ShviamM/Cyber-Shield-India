# Security headers shared by the website and admin nginx images.
# The CSP is deliberately limited to directives that cannot break third-party
# scripts (MSG91, Razorpay, Google Fonts): it blocks clickjacking, plugins and
# <base> hijacking. Tighten script-src/connect-src once those origins are audited.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\" \"https://api.razorpay.com\")" always;
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
